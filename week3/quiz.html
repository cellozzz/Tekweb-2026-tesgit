<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-clifford: oklch(71.5% 0.143 215.221);
      }
    </style>
  </head>
  <body class="p-4>
    <h1 class="text-3xl font-bold underline text-clifford italic md:text-5xl md:text-blue-500 mb-4">
      Hello world!
    </h1>

    <div class="flex">
      <div class="bg-blue-500 text-black p-3 hidden md:block md:w-1/2 dark:bg-yellow-500">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Temporibus sequi, assumenda sunt optio vero impedit doloribus aliquid culpa.
      </div>

      <div class="w-full md:w-1/2 p-3">
        <textarea class="w-full border-black-500 border-2 p-2 focus:outline-none">Lorem ipsum dolor sit amet consectetur adipisicing elit. Ipsa nulla sapiente exceptu</textarea>
        
        <div class="flex justify-center mt-4">
          <button class="bg-blue-400 text-white font-semibold py-2 px-6 rounded-xl hover:bg-blue-500 transition">
            Save Changes
          </button>
        </div>
      </div>
    </div>
    <div class="mt-6">
      <button onclick="goDark()" class="text-sm text-gray-700 cursor-pointer underline">
        Dark Mode
      </button>
    </div>

    <script>
      function goDark() {
        document.documentElement.classList.toggle('dark');
      }
    </script>
  </body>
</html>
