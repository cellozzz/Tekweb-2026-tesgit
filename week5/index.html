<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
</head>
<body class="p-6">
    <h1 class="text-2xl font-bold mb-4">Hello World</h1>

    <div class="flex gap-2 mb-4">
        <button id="toggleButton" class="bg-blue-500 text-white px-3 py-1 rounded">Sembunyikan</button>
        <button id="tambahButton" class="bg-green-500 text-white px-3 py-1 rounded">Tambah Teks</button>
        <button id="tampilkanBuahButton" class="bg-purple-500 text-white px-3 py-1 rounded">Tampilkan Buah</button>
    </div>

    <div id="daftar" class="mb-6 font-semibold"></div>

    <div class="w-full bg-blue-200 p-2 rounded mb-4">
        <input type="text" id="search" placeholder="Search..." class="p-2 border rounded w-full">
    </div>

    <table class="w-full border-collapse border border-gray-300">
        <thead>
            <tr class="bg-gray-100">
                <th class="border border-gray-300 p-2">Kode</th>
                <th class="border border-gray-300 p-2">Item</th>
            </tr>
        </thead>
        <tbody id="table">
        </tbody>
    </table>

    <script>
        $(document).ready(function(){
            var barang = ['meja', 'kursi', 'keyboard', 'monitor'];
            $.each(barang, function(key, value){
                var kode = 'BRG00' + (key + 1);
                $('#table').append(`<tr><td class="border p-2">${kode}</td><td class="border p-2">${value}</td></tr>`);       
            });
            $("#search").on("keyup", function() {
                var value = $(this).val().toLowerCase();$("#table tr").filter(function() {
                    $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1);
                });
            });

            $('#toggleButton').on('click', function(){
                $('h1').toggle();
                if ($('h1').is(':visible')) {$(this).html('Sembunyikan');
                } else {
                    $(this).html('Tampilkan');
                }
            });

            $('#tambahButton').on('click', function(){
                var hello = $('h1').html();$('#daftar').append(`<div>${hello}</div>`);
            });
            $('#tampilkanBuahButton').on('click', function(){
                var buah = ['Apel', 'Jeruk', 'Mangga', 'Pisang'];
                $.each(buah, function(key, value){
                    $('#daftar').append(`<div>${key + 1}. ${value}</div>`);
                });
            });
        });
    </script>
</body>
</html>
